<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content">
<title>Křížovka: Komunismus</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;700&family=Literata:opsz,wght@18..36,400;18..36,500;18..36,600;18..36,700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#15121c;
    --panel:#1f1a29;
    --panel2:#241f30;
    --accent:#b0272e;
    --accent2:#8a1f24;
    --gold:#c9a04a;
    --text:#eae4d8;
    --muted:#a89bc0;
    --cell:#f4efe4;
    --cell-border:#0c0a10;
    --cell-active:#e8c76b;
    --cell-word:#3c3350;
    --ok:#4e9a51;
    --bad:#b0272e;
    --font-display:'Oswald', 'Arial Narrow', sans-serif;
    --font-body:'Literata', Georgia, 'Times New Roman', serif;
  }
  *{box-sizing:border-box;}
  html{ -webkit-text-size-adjust:100%; scroll-padding-top:env(safe-area-inset-top,0px); }
  body{
    margin:0;
    background: radial-gradient(circle at 20% 0%, #241f30 0%, #15121c 55%, #0e0c13 100%);
    color:var(--text);
    font-family: var(--font-body);
    min-height:100vh;
    padding:calc(14px + env(safe-area-inset-top,0px)) 10px calc(60px + env(safe-area-inset-bottom,0px));
  }
  h1{
    text-align:center;
    font-family: var(--font-display);
    font-weight:700;
    font-size:1.6rem;
    letter-spacing:1.5px;
    color:var(--gold);
    text-transform:uppercase;
    margin:6px 0 8px;
    text-shadow:0 0 14px rgba(201,160,74,.35);
  }
  h1::after{
    content:"";
    display:block;
    width:56px;
    height:3px;
    margin:8px auto 0;
    background:var(--accent);
    border-radius:2px;
  }
  .subtitle{
    text-align:center;
    color:var(--muted);
    font-size:.9rem;
    margin-bottom:16px;
    letter-spacing:.3px;
  }

  /* sticky "current clue" bar — always visible while filling, key for mobile */
  .clue-bar{
    position:sticky;
    top:env(safe-area-inset-top,0px);
    z-index:20;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    height:64px;
    background:linear-gradient(135deg,#2b2138 0%,#1c1626 60%,#231a2e 100%);
    border:1px solid rgba(201,160,74,.3);
    border-top:2px solid var(--gold);
    border-radius:12px;
    padding:8px 12px;
    max-width:1100px;
    margin:0 auto 16px;
    box-shadow:0 10px 24px rgba(0,0,0,.5), inset 0 1px 0 rgba(255,255,255,.05);
  }
  #clueBarSentinel{ height:0; }
  .clue-bar .nav-btn{
    flex:0 0 auto;
    width:42px; height:42px;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:0;
    min-height:0;
    border-radius:50%;
    background:radial-gradient(circle at 35% 30%,#564870,#2c2438 70%);
    color:var(--gold);
    border:2px solid rgba(201,160,74,.55);
    cursor:pointer;
    box-shadow:0 3px 8px rgba(0,0,0,.45), inset 0 1px 1px rgba(255,255,255,.08);
    transition:transform .12s, background .15s, border-color .15s, box-shadow .15s;
    touch-action:manipulation;
  }
  .clue-bar .nav-btn svg{ display:block; }
  .clue-bar .nav-btn:disabled{ opacity:.35; box-shadow:none; }
  /* Šipky Předchozí/Další otázka patří jen do mobilního rozvržení — na
     desktopu by jen zabíraly místo v pruhu s otázkou. */
  .clue-bar .nav-btn{ display:none; }
  .clue-bar .nav-btn:hover{
    border-color:var(--gold);
    box-shadow:0 3px 10px rgba(0,0,0,.5), 0 0 0 3px rgba(201,160,74,.15);
  }
  .clue-bar .nav-btn:active{
    background:radial-gradient(circle at 35% 30%,#c8394a,var(--accent2) 70%);
    color:#fff;
    border-color:var(--gold);
    transform:scale(.9);
  }
  @media (prefers-reduced-motion: reduce){ .clue-bar .nav-btn{ transition:none; } .clue-bar .nav-btn:active{ transform:none; } }
  .clue-bar .clue-text{
    flex:1 1 auto;
    min-width:0;
    height:100%;
    display:flex;
    align-items:center;
    overflow-y:auto;
    -webkit-overflow-scrolling:touch;
    font-family: var(--font-body);
    font-size:.95rem;
    line-height:1.3;
  }
  /* políčka aktuálního slova, zobrazená pod otázkou pro snadnější doplňování */
  .clue-fields{
    position:relative;
    z-index:25;
    display:flex;
    gap:6px;
    justify-content:center;
    flex-wrap:nowrap;
    overflow-x:auto;
    -webkit-overflow-scrolling:touch;
    padding:10px 4px 4px;
    max-width:1100px;
    margin:0 auto 16px;
  }
  .clue-fields:empty{ display:none; margin:0; padding:0; }
  .clue-fields .cf-box{
    flex:0 0 auto;
    width:36px;
    height:36px;
    text-align:center;
    text-transform:uppercase;
    font-family:var(--font-display);
    font-size:1.05rem;
    font-weight:600;
    color:#15121c;
    background:var(--cell);
    border:2px solid rgba(201,160,74,.55);
    border-radius:6px;
    outline:none;
    caret-color:var(--accent);
    padding:0;
    -webkit-appearance:none;
    appearance:none;
  }
  .clue-fields .cf-box:focus{
    border-color:var(--gold);
    box-shadow:0 0 0 3px rgba(201,160,74,.3);
  }
  .clue-fields .cf-box.correct{
    border-color:var(--ok);
    box-shadow:0 0 0 2px rgba(78,154,81,.35);
  }
  .clue-fields .cf-box.incorrect{
    border-color:var(--bad);
    box-shadow:0 0 0 2px rgba(176,39,46,.3);
  }
  @media (max-width:380px){
    .clue-fields .cf-box{ width:32px; height:32px; font-size:1rem; }
  }
  .clue-bar .clue-text b{
    flex:0 0 auto;
    display:inline-flex;
    align-items:center;
    justify-content:center;
    min-width:24px;
    height:24px;
    padding:0 6px;
    margin-right:9px;
    background:var(--gold);
    color:#2a1d10;
    font-family:var(--font-display);
    font-weight:600;
    font-size:.78rem;
    border-radius:7px;
    box-shadow:0 2px 4px rgba(0,0,0,.3);
  }

  .wrap{
    max-width:1100px;
    margin:0 auto;
    display:flex;
    flex-direction:column;
    gap:12px;
    width:100%;
  }
  .board-card{
    position:relative;
    background:var(--panel);
    border:none;
    border-radius:0;
    padding:0;
    box-shadow:none;
    overflow:visible;
    /* bleed past the page's own side padding so the board touches the real screen edges */
    width:calc(100% + 20px);
    margin:0 -10px;
    max-height:78vh;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  #grid{
    display:grid;
    gap:2px;
    background:var(--cell-border);
    border:2px solid var(--cell-border);
    width:max-content;
    margin:0 auto;
    touch-action:manipulation;
  }
  .cell{
    position:relative;
    width:var(--cell-size, 30px);
    height:var(--cell-size, 30px);
    background:var(--cell);
    transition:transform .15s ease;
    transform-origin:center;
  }
  .cell.block{
    background:transparent;
    visibility:hidden;
  }
  .cell input{
    width:100%;
    height:100%;
    border:none;
    background:transparent;
    text-align:center;
    font-family: var(--font-display);
    font-size:16px; /* >=16px keeps iOS/Android from auto-zooming on focus */
    font-weight:600;
    color:#1c1620;
    text-transform:uppercase;
    outline:none;
    caret-color:transparent;
    padding:0;
    transition:background .15s ease;
  }
  .cell.inword{ transform:scale(1.06); z-index:2; }
  .cell.active{ transform:scale(1.16); z-index:3; }
  .cell.active input, .cell.inword input{ box-shadow:0 2px 8px rgba(0,0,0,.4); border-radius:2px; }
  .cell.active input{ background:var(--cell-active); }
  .cell.inword input{ background:#f0d99a; }
  .cell.correct input{ background:#bfe3c0; color:#245126; }
  .cell.incorrect input{ background:#f2b8ba; color:#7a1a1a; }
  .num{
    position:absolute;
    top:1px; left:2px;
    font-size:10px;
    font-weight:700;
    color:#3a2f18;
    font-family: var(--font-display);
    pointer-events:none;
  }
  .controls{
    display:flex;
    gap:10px;
    justify-content:center;
    margin:22px auto 0;
    max-width:1100px;
    flex-wrap:wrap;
  }
  button{
    background:var(--accent);
    color:#fff;
    border:none;
    padding:12px 22px;
    min-height:46px;
    border-radius:7px;
    font-family:var(--font-display);
    font-weight:500;
    font-size:.92rem;
    letter-spacing:1px;
    text-transform:uppercase;
    cursor:pointer;
    box-shadow:0 4px 10px rgba(176,39,46,.35);
    transition:transform .1s, background .15s;
    touch-action:manipulation;
  }
  button:hover{ background:var(--accent2); transform:translateY(-1px); }
  button:focus-visible, input:focus-visible{
    outline:2px solid var(--gold);
    outline-offset:2px;
  }
  @media (prefers-reduced-motion: reduce){
    button{ transition:none; }
    button:hover{ transform:none; }
  }
  button.secondary{
    background:#3a3148;
    box-shadow:none;
  }
  button.secondary:hover{ background:#463a5a; }
  #status{
    text-align:center;
    margin-top:14px;
    font-size:.92rem;
    min-height:1.2em;
    color:var(--muted);
  }
  #status.win{
    color:var(--gold);
    font-size:1.15rem;
    font-weight:bold;
    text-shadow:0 0 10px rgba(201,160,74,.5);
  }
  @media (max-width:720px){
    :root{ --cell-size:32px; }
    h1{ font-size:1.3rem; letter-spacing:1px; }
    .subtitle{ font-size:.82rem; }
    .wrap{ gap:14px; }
    .controls{ gap:8px; }
    .controls button{ flex:1 1 auto; min-width:0; padding:12px 8px; font-size:.82rem; }
    .clue-bar{ padding:6px 10px; }
    .clue-bar .clue-text{ font-size:.86rem; }
  }
  @media (max-width:380px){
    :root{ --cell-size:28px; }
  }

  /* small info button that opens the text reader, sitting on the right of the clue bar */
  .info-btn{
    flex:0 0 auto;
    display:flex;
    align-items:center;
    gap:8px;
    background:none;
    border:none;
    padding:0;
    color:var(--gold);
    font-family:var(--font-display);
    font-size:.72rem;
    letter-spacing:.4px;
    text-transform:uppercase;
    cursor:pointer;
    touch-action:manipulation;
  }
  .info-btn-icon{ width:46px; height:46px; line-height:0; border-radius:4px; overflow:hidden; flex:0 0 auto; }
  .info-btn-icon img, .info-btn-icon canvas{ display:block; width:46px; height:46px; }
  .info-btn:hover .info-btn-icon{ box-shadow:0 0 0 2px var(--gold); }
  @media (max-width:720px){
    .info-btn-label{ display:none; } /* icon-only on small screens to stay out of the way */
  }

  .modal-footer-qr{
    display:flex;
    align-items:center;
    gap:12px;
    padding:0 18px 14px;
    color:var(--muted);
    font-size:.78rem;
    line-height:1.35;
  }
  .modal-footer-qr #qrcode{ width:64px; height:64px; flex:0 0 auto; line-height:0; border-radius:6px; overflow:hidden; }
  .modal-footer-qr #qrcode img, .modal-footer-qr #qrcode canvas{ display:block; width:64px; height:64px; }

  .modal-overlay{
    position:fixed;
    inset:0;
    z-index:50;
    background:rgba(10,8,14,.78);
    display:flex;
    align-items:center;
    justify-content:center;
    padding:16px;
  }
  .modal-overlay.hidden{ display:none; }
  .modal-box{
    background:var(--panel);
    border:1px solid #3a3148;
    border-radius:12px;
    max-width:640px;
    width:100%;
    max-height:min(88vh, calc(100vh - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px) - 24px));
    display:flex;
    flex-direction:column;
    box-shadow:0 14px 40px rgba(0,0,0,.6);
  }
  .modal-header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    padding:14px 16px 10px;
    border-bottom:1px solid #3a3148;
  }
  .modal-header h2{
    margin:0;
    font-family: var(--font-display);
    font-weight:600;
    font-size:1.05rem;
    color:var(--gold);
    letter-spacing:.4px;
    line-height:1.3;
  }
  .modal-header button{
    background:#3a3148;
    min-height:0;
    padding:8px 13px;
    font-size:.9rem;
    box-shadow:none;
  }
  .modal-header button:hover{ background:var(--accent2); }
  .modal-body{
    padding:16px 18px 18px;
    overflow-y:auto;
    -webkit-overflow-scrolling:touch;
    font-family: var(--font-body);
    font-size:1.02rem;
    line-height:1.65;
    color:var(--text);
  }
  .modal-body p{ margin:0 0 14px; }
  .modal-body p.quote{
    font-style:italic;
    color:var(--gold);
    border-left:3px solid var(--gold);
    padding-left:12px;
    margin:16px 0;
  }
  .modal-nav{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    padding:10px 16px 14px;
    border-top:1px solid #3a3148;
  }
  .modal-nav button{ padding:8px 14px; font-size:.8rem; }
  .modal-nav button:disabled{ opacity:.4; cursor:default; box-shadow:none; }
  #textPageIndicator{
    font-size:.78rem;
    color:var(--muted);
    letter-spacing:.5px;
  }


  /* ==========================================================================
     MOBILNÍ ROZVRŽENÍ (na výšku, do 768px)
     Vše je seshora u sebe: mřížka, hned pod ní otázka s políčky;
     dole zůstávají jen placatá tlačítka. Vše se vejde nad klávesnici.
     Desktopové rozvržení se nemění.
     ========================================================================== */
  #bottomPanel{ display:none; } /* na desktopu je panel prázdný a skrytý */

  @media (max-width:768px) and (orientation:portrait){
    html{ height:100%; overflow:hidden; }
    body{
      height:100dvh;
      min-height:0;
      overflow:hidden;
      /* klávesnice zabírá spodní část — necháme ji překrývat prázdné
         pozadí stránky, panel držíme v bezpečné viditelné části */
      padding:calc(2px + env(safe-area-inset-top,0px)) 4px var(--kb-offset, 0px);
      display:flex;
      flex-direction:column;
    }
    h1{ font-size:1.05rem; letter-spacing:1px; margin:0 0 1px; }
    h1::after{ width:40px; margin:4px auto 0; }
    .subtitle{ font-size:.68rem; margin-bottom:4px; }

    /* --- horní pás: křížovka + otázka + políčka — vše nahoře u sebe --- */
    .board-area{
      flex:1 1 auto;
      min-height:0;
      display:flex;
      flex-direction:column;
      overflow-y:auto;
      overscroll-behavior:contain;
      -webkit-overflow-scrolling:touch;
      padding-bottom:6px;
      align-items:stretch;
      justify-content:flex-start;
      gap:4px;
    }
    .board-area > .wrap{ margin:0 auto; width:100%; }  /* vše nahoru, nic necentrovat */
    .board-card{ width:100%; margin:0; max-height:none; }

    /* otázka + políčka patří na mobilu nahoru hned pod mřížku,
       aby byly vidět zároveň s ní i s klávesnicí */
    .board-area > .clue-bar,
    #bottomPanel > .clue-bar{
      position:sticky;
      top:0;
      z-index:30;
      width:100%;
      max-width:none;
      height:auto;
      gap:4px;
      margin:0;
      padding:2px 4px;
      border-top-width:1px;
      border-radius:9px;
      box-shadow:none;
    }
    .board-area > .clue-fields,
    #bottomPanel > .clue-fields{
      position:sticky;
      top:0;
      z-index:29;
      width:100%;
      max-width:none;
      margin:0;
      padding:2px 0;
      background:transparent;
    }
    /* --- spodní panel: jen tlačítka + stav, co nejplošší --- */
    #bottomPanel{
      display:flex;
      flex-direction:column;
      gap:4px;
      flex:0 0 auto;
      position:static;
      z-index:40;
      margin:0 -4px;
      padding:4px 6px calc(4px + env(safe-area-inset-bottom,0px));
      background:linear-gradient(180deg,#2b2138 0%,#1b1526 100%);
      border-top:2px solid var(--gold);
      box-shadow:0 -10px 26px rgba(0,0,0,.6);
    }
    #bottomPanel > .clue-bar{
      position:static;
      top:auto;
      width:100%;
      max-width:none;
      height:auto;
      gap:4px;
      margin:0;
      padding:2px 4px;
      border-top-width:1px;
      border-radius:9px;
      box-shadow:none;
    }
    /* malé šipky na přepínání otázek palcem */
    .board-area > .clue-bar .nav-btn,
    #bottomPanel > .clue-bar .nav-btn{
      display:flex;
      flex:0 0 auto;
      width:34px;
      height:34px;
      min-width:0;
      min-height:0;
      padding:0;
      border-width:1px;
    }
    .board-area > .clue-bar .clue-text,
    #bottomPanel > .clue-bar .clue-text{
      height:auto;
      max-height:2.6em;       /* max 2 řádky — delší otázka se odroluje uvnitř, panel zůstane placatý */
      overflow-y:auto;
      font-size:.8rem;
      line-height:1.25;
    }
    .board-area > .clue-bar .clue-text b,
    #bottomPanel > .clue-bar .clue-text b{
      min-width:20px;
      height:20px;
      padding:0 5px;
      margin-right:6px;
      font-size:.72rem;
    }
    /* QR kód v pravém horním rohu je na mobilu úplně skrytý — zůstává
       jen zjednodušený textový odkaz „Text k tématu“ */
    .board-area > .clue-bar .info-btn,
    #bottomPanel > .clue-bar .info-btn{ box-shadow:none; gap:0; padding:0; }
    .board-area > .clue-bar .info-btn-icon,
    #bottomPanel > .clue-bar .info-btn-icon{ display:none; }
    .board-area > .clue-bar .info-btn-label,
    #bottomPanel > .clue-bar .info-btn-label{
      display:inline;
      max-width:74px;
      color:var(--gold);
      font-size:.62rem;
      line-height:1.15;
      text-align:right;
      text-decoration:underline;
      text-underline-offset:2px;
    }
    .board-area > .clue-fields,
    #bottomPanel > .clue-fields{
      width:100%;
      max-width:none;
      margin:0;
      padding:2px 0;
      gap:3px;
      justify-content:flex-start;
      overflow-x:auto;
    }
    .board-area > .clue-fields .cf-box,
    #bottomPanel > .clue-fields .cf-box{ width:30px; height:30px; font-size:.95rem; border-width:1px; }
    #bottomPanel > .controls{
      width:100%;
      max-width:none;
      margin:0;
      gap:6px;
      flex-wrap:nowrap;   /* Zkontrolovat + Vymazat vedle sebe, ať nezabírají výšku */
    }
    #bottomPanel > .controls button{
      flex:1 1 0;
      min-width:0;
      min-height:34px;
      padding:6px 6px;
      font-size:.72rem;
      letter-spacing:.5px;
    }
    #bottomPanel > #status{
      margin:0;
      min-height:0;
      font-size:.72rem;
      line-height:1.2;
    }
    #bottomPanel > #status:empty{ display:none; } /* prázdná hláška nezabírá místo */
  }
</style>
</head>
<body>

<div id="clueBarSentinel"></div>
<div class="clue-bar" id="clueBar">
  <button class="nav-btn" id="cluePrevBtn" type="button" title="Předchozí otázka" aria-label="Předchozí otázka">
    <svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5 8 12l7 7" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
  </button>
  <div class="clue-text" id="clueBarText">Vyber políčko…</div>
  <button class="nav-btn" id="clueNextBtn" type="button" title="Další otázka" aria-label="Další otázka">
    <svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5l7 7-7 7" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
  </button>
  <button class="info-btn" id="qrCorner" title="Text k tématu" aria-label="Otevřít text k tématu">
    <span class="info-btn-icon" id="qrCornerMini" aria-hidden="true"></span>
    <span class="info-btn-label">Text k tématu</span>
  </button>
</div>
<div class="clue-fields" id="clueFields"></div>

<!-- horní pás: na mobilu (portrait) sem JS přesune i otázku s políčky,
     aby byly mřížka + kontent vidět zároveň nahoře nad klávesnicí -->
<div class="board-area" id="boardArea">
  <div class="wrap">
    <div class="board-card">

<script>
const PUZZLE = {

  {"num":2,"word":"OSTRAVA","clue":"Město, kde si máme představit dělnický život v roce 1946","row":1,"col":2,"len":7},

  {"num":12,"word":"DVACÁTÉ","clue":"Století, kdy komunisté vyhráli volby v Československu","row":9,"col":7,"len":7}

};

const gridEl = document.getElementById('grid');
gridEl.style.gridTemplateColumns = `repeat(${PUZZLE.cols}, var(--cell-size, 30px))`;
gridEl.style.gridTemplateRows = `repeat(${PUZZLE.rows}, var(--cell-size, 30px))`;

// ---- Mobilní rozvržení (na výšku): rozpoznání režimu ------------------------
// Na mobilu na výšku je vše nahoře u sebe: mřížka, hned pod ní otázka
// s políčky pro zápis; dole zůstávají jen tlačítka. Vše se vejde nad
// softwarovou klávesnici.
const mobileLayoutMQ = window.matchMedia('(max-width: 768px) and (orientation: portrait)');
const boardAreaEl = document.getElementById('boardArea');
const bottomPanelEl = document.getElementById('bottomPanel');
let currentPanelH = 0;    // výška spodního panelu v px (drží se v --bottom-panel-h)
let currentKbOffset = 0;  // o kolik je potřeba obsah zvednout nad softwarovou klávesnici

function isMobilePortrait(){
  return mobileLayoutMQ.matches;
}

// Výškový rozpočet pro mřížku. Na mobilu viditelná část displeje
// (visualViewport) mínus titulek, otázka s políčky a spodní tlačítka —
// díky tomu je mřížka vždy celá nahoře a nad klávesnicí je vidět i kontent.
function boardHeightBudget(){
  if(isMobilePortrait() && boardAreaEl){
    const vv = window.visualViewport;
    const visibleH = vv ? vv.height : window.innerHeight;
    const doc = document.documentElement;
    const panelH = currentPanelH
      || parseFloat(getComputedStyle(doc).getPropertyValue('--bottom-panel-h')) || 0;
    // titulek + podtitulek + otázka s políčky + rezervy (bezpečně i s notch)
    const headerH = 64;
    const clueH = 108;
    const h = visibleH - headerH - clueH - panelH - 10;
    if(h > 120) return h;
    return Math.max(120, visibleH * 0.30);
  }
  return window.innerHeight * 0.78;
}

// Fit the whole board to the screen width so nothing gets cropped and no
// horizontal scrollbar is needed, instead of relying on fixed breakpoints.
function fitGridToViewport(){
  const boardCard = document.querySelector('.board-card');
  if(!boardCard) return;
  const cardStyles = getComputedStyle(boardCard);
  const cardPadX = parseFloat(cardStyles.paddingLeft) + parseFloat(cardStyles.paddingRight)
    + 2*parseFloat(cardStyles.borderLeftWidth||0);
  const cardPadTop = parseFloat(cardStyles.paddingTop) || 0;
  const cardPadBottom = parseFloat(cardStyles.paddingBottom) || 0;
  const gridBorder = 4; // 2px border on each side of #grid
  const gapTotalCols = (PUZZLE.cols - 1) * 2; // 2px gap between cells
  const gapTotalRows = (PUZZLE.rows - 1) * 2;

  // The board bleeds edge-to-edge, so measure its actual rendered width
  // directly rather than re-deriving it from the page's own padding.
  const boardWidth = boardCard.getBoundingClientRect().width || window.innerWidth;
  const availableWidth = boardWidth - cardPadX - gridBorder;
  const sizeByWidth = Math.floor((availableWidth - gapTotalCols) / PUZZLE.cols);

  // ...and against its viewport height budget, so the whole grid stays
  // visible without needing to scroll. Na mobilu (portrait) je tím rozpočtem
  // jen horní pás displeje nad spodním panelem – viz boardHeightBudget().
  const heightBudget = boardHeightBudget();
  const availableHeight = heightBudget - cardPadTop - cardPadBottom - gridBorder;
  const sizeByHeight = Math.floor((availableHeight - gapTotalRows) / PUZZLE.rows);

  let size = Math.min(sizeByWidth, sizeByHeight);
  size = Math.max(11, Math.min(40, size));
  document.documentElement.style.setProperty('--cell-size', size + 'px');
}
fitGridToViewport();
window.addEventListener('resize', fitGridToViewport);
window.addEventListener('orientationchange', fitGridToViewport);

// build cell map
const cellData = {}; // "r,c" -> {letter, inputEl, wordEls:Set}
const inputs = {}; // "r,c" -> input element

for(let r=0;r<PUZZLE.rows;r++){
  for(let c=0;c<PUZZLE.cols;c++){
    const key = `${r},${c}`;
    const div = document.createElement('div');
    if(PUZZLE.cells[key]){
      div.className = 'cell';
      div.dataset.r = r; div.dataset.c = c;
      if(PUZZLE.numbers[key]){
        const num = document.createElement('div');
        num.className = 'num';
        num.textContent = PUZZLE.numbers[key];
        div.appendChild(num);
      }
      const input = document.createElement('input');
      input.maxLength = 1;
      input.autocomplete = 'off';
      input.dataset.r = r; input.dataset.c = c;
      div.appendChild(input);
      inputs[key] = input;
      cellData[key] = {letter: PUZZLE.cells[key], cellEl: div};
    } else {
      div.className = 'cell block';
    }
    gridEl.appendChild(div);
  }
}

// build word -> cell list, and cell -> words map
const words = []; // {dir, num, cells:[key...], clue, answer}
function buildWordCells(item, dir){
  const cells = [];
  for(let i=0;i<item.len;i++){
    const r = dir==='A' ? item.row : item.row+i;
    const c = dir==='A' ? item.col+i : item.col;
    cells.push(`${r},${c}`);
  }
  return cells;
}
PUZZLE.across.forEach(it=>{
  words.push({dir:'A', num:it.num, cells: buildWordCells(it,'A'), clue: it.clue, answer: it.word});
});
PUZZLE.down.forEach(it=>{
  words.push({dir:'D', num:it.num, cells: buildWordCells(it,'D'), clue: it.clue, answer: it.word});
});

const cellWords = {}; // key -> [wordIndex,...]
words.forEach((w, idx)=>{
  w.cells.forEach(key=>{
    if(!cellWords[key]) cellWords[key] = [];
    cellWords[key].push(idx);
  });
});

let currentWordIdx = null;
let currentCellKey = null;

function clearHighlights(){
  document.querySelectorAll('.cell.inword').forEach(el=>el.classList.remove('inword'));
  document.querySelectorAll('.cell.active').forEach(el=>el.classList.remove('active'));
}

function highlightWord(idx){
  clearHighlights();
  const w = words[idx];
  w.cells.forEach(key=>{
    const cd = cellData[key];
    if(cd) cd.cellEl.classList.add('inword');
  });
  updateClueBar(idx);
  renderClueFields(idx);
}

function updateClueBar(idx){
  const w = words[idx];
  const bar = document.getElementById('clueBarText');
  bar.innerHTML = `<b>${w.num}</b> ${w.clue}`;
  updateArrowState(idx);
}

// pás políček pod otázkou — zrcadlí buňky aktuálního slova, mění se s délkou slova
const clueFieldsEl = document.getElementById('clueFields');

// ---- Mobilní rozvržení: spodní panel nad klávesnicí ------------------------
const clueBarEl = document.getElementById('clueBar');
const controlsEl = document.querySelector('.controls');
const statusEl = document.getElementById('status');
const cluePrevBtn = document.getElementById('cluePrevBtn');
const clueNextBtn = document.getElementById('clueNextBtn');

// Prvky, které na mobilu patří nahoru hned pod/před mřížku (v tomto pořadí),
// a prvky, které zůstávají ve spodním panelu (jen tlačítka + stav).
const topItems = [clueBarEl, clueFieldsEl];
const bottomItems = [controlsEl, statusEl];
const panelItems = [...topItems, ...bottomItems];
// Původní místo v DOMu, kam se prvky vrací při přepnutí na desktop.
const desktopSlots = new Map();
function rememberSlot(el){
  if(!el || desktopSlots.has(el)) return;
  desktopSlots.set(el, {parent: el.parentNode, next: el.nextSibling});
}
function restoreSlot(el){
  const slot = el ? desktopSlots.get(el) : null;
  if(!slot) return;
  const fromTop = el.parentNode === boardAreaEl;
  const fromBottom = bottomPanelEl && el.parentNode === bottomPanelEl;
  if(!fromTop && !fromBottom) return;
  const ref = slot.next && slot.next.parentNode === slot.parent ? slot.next : null;
  slot.parent.insertBefore(el, ref);
}

function applyMobileLayout(){
  if(!bottomPanelEl || !boardAreaEl) return;
  const wrapEl = boardAreaEl.querySelector('.wrap');
  if(isMobilePortrait()){
    topItems.forEach(el=>{
      if(!el) return;
      rememberSlot(el);
      // mřížka první, otázka + políčka hned pod ni — vše nahoře u sebe
      if(wrapEl && el.parentNode !== boardAreaEl) boardAreaEl.insertBefore(el, wrapEl.nextSibling);
      else if(!wrapEl && el.parentNode !== boardAreaEl) boardAreaEl.appendChild(el);
    });
    // v boardArea držíme pořadí: mřížka (.wrap), otázka, políčka
    if(wrapEl) boardAreaEl.insertBefore(wrapEl, boardAreaEl.firstChild);
    if(clueBarEl && clueFieldsEl && clueFieldsEl.parentNode === boardAreaEl
      && clueBarEl.parentNode === boardAreaEl){
      boardAreaEl.insertBefore(clueBarEl, clueFieldsEl);
    }
    bottomItems.forEach(el=>{
      if(!el) return;
      rememberSlot(el);
      if(el.parentNode !== bottomPanelEl) bottomPanelEl.appendChild(el);
    });
  } else {
    // Zpět v opačném pořadí — každý prvek se vrací před svého původního
    // následníka, který je v tu chvíli už také zpátky na svém místě.
    panelItems.slice().reverse().forEach(restoreSlot);
  }
  measureBottomPanel();
}

function measureBottomPanel(){
  if(!bottomPanelEl) return;
  const h = isMobilePortrait() ? Math.round(bottomPanelEl.getBoundingClientRect().height) : 0;
  // i stejná výška panelu při otevřené klávesnici mění rozpočet mřížky
  // (visualViewport se zmenší), takže refit vynutíme vždy
  currentPanelH = h;
  document.documentElement.style.setProperty('--bottom-panel-h', h + 'px');
  scheduleRefit();
}

// Změna velikosti mřížky se odkládá do dalšího snímku, aby se neběhalo
// uprostřed probíhajícího layoutu (např. z ResizeObserveru).
let refitScheduled = false;
function scheduleRefit(){
  if(refitScheduled) return;
  refitScheduled = true;
  requestAnimationFrame(()=>{
    refitScheduled = false;
    fitGridToViewport();
  });
}

// Softwarová klávesnice: zmenší se visualViewport (typicky iOS), proto
// obsah zvedáme přesně nad jeho viditelnou část. Díky tomu je mřížka,
// otázka i políčka vidět zároveň nad klávesnicí.
function updateKeyboardOffset(){
  const vv = window.visualViewport;
  let kb = 0;
  if(isMobilePortrait() && vv){
    const visibleBottom = vv.height + vv.offsetTop;   // spodní hrana viditelné části
    kb = Math.round(Math.max(0, window.innerHeight - visibleBottom));
    if(kb < 8) kb = 0;                                // drobné kmity ignorujeme
  }
  if(kb === currentKbOffset) return;
  currentKbOffset = kb;
  document.documentElement.style.setProperty('--kb-offset', kb + 'px');
  // po zvednutí nad klávesnici může být potřeba přeměřit panel i mřížku
  measureBottomPanel();
}

// Na mobilu posune horní pás s mřížkou tak, aby aktivní slovo zůstalo vidět
// nad spodním panelem (a případně i nad klávesnicí). Když je slovo celé
// vidět, nic se neposouvá.
function centerWordInBoardArea(){
  if(!isMobilePortrait() || !boardAreaEl || currentWordIdx === null) return;
  const w = words[currentWordIdx];
  if(!w) return;
  const areaRect = boardAreaEl.getBoundingClientRect();
  const styles = getComputedStyle(boardAreaEl);
  const viewTop = areaRect.top + (parseFloat(styles.paddingTop) || 0);
  const viewBottom = areaRect.bottom - (parseFloat(styles.paddingBottom) || 0);
  let wordTop = Infinity, wordBottom = -Infinity;
  w.cells.forEach(key=>{
    const cd = cellData[key];
    if(!cd) return;
    const r = cd.cellEl.getBoundingClientRect();
    wordTop = Math.min(wordTop, r.top);
    wordBottom = Math.max(wordBottom, r.bottom);
  });
  if(!isFinite(wordTop) || !isFinite(wordBottom)) return;
  if(wordTop >= viewTop && wordBottom <= viewBottom) return;
  const freeSpace = (viewBottom - viewTop) - (wordBottom - wordTop);
  const shift = wordTop - (viewTop + Math.max(0, freeSpace) / 2);
  const maxScroll = Math.max(0, boardAreaEl.scrollHeight - boardAreaEl.clientHeight);
  boardAreaEl.scrollTop = Math.max(0, Math.min(maxScroll, Math.round(boardAreaEl.scrollTop + shift)));
}

// Přepnutí na předchozí/další otázku šipkami ve spodním panelu.
// Nekonečné přepínání: po poslední otázce skočí zase na první a naopak.
function stepWord(delta){
  if(!words.length) return;
  const base = currentWordIdx === null ? 0 : currentWordIdx + delta;
  const idx = ((base % words.length) + words.length) % words.length;
  const w = words[idx];
  currentWordIdx = idx;
  currentCellKey = w.cells[0];
  highlightWord(idx);
  const cd = cellData[w.cells[0]];
  if(cd){
    cd.cellEl.classList.add('active');
    if(!isMobilePortrait()){
      cd.cellEl.scrollIntoView({block:'center', inline:'center', behavior:'smooth'});
    }
  }
  if(isMobilePortrait()){
    clueFieldsEl.scrollLeft = 0;   // políčka nové otázky pěkně od začátku
    centerWordInBoardArea();
  }
}

function updateArrowState(idx = currentWordIdx){
  if(!cluePrevBtn || !clueNextBtn) return;
  // nekonečné přepínání — šipky se nikdy nedeaktivují
  cluePrevBtn.disabled = false;
  clueNextBtn.disabled = false;
}

function renderClueFields(idx){
  clueFieldsEl.innerHTML = '';
  const w = words[idx];
  w.cells.forEach((key, pos)=>{
    const real = inputs[key];
    const cd = cellData[key];
    const box = document.createElement('input');
    box.type = 'text';
    box.maxLength = 1;
    box.autocomplete = 'off';
    box.autocapitalize = 'characters';
    box.spellcheck = false;
    box.inputMode = 'text';
    box.className = 'cf-box';
    box.dataset.key = key;
    box.dataset.pos = pos;
    box.value = real ? real.value : '';
    if(cd && cd.cellEl.classList.contains('correct')) box.classList.add('correct');
    if(cd && cd.cellEl.classList.contains('incorrect')) box.classList.add('incorrect');

    box.addEventListener('focus', ()=>{
      currentCellKey = key;
      document.querySelectorAll('.cell.active').forEach(el=>el.classList.remove('active'));
      if(cd) cd.cellEl.classList.add('active');
      // na mobilu držíme aktivní slovo nad spodním panelem / klávesnicí
      if(isMobilePortrait()) centerWordInBoardArea();
    });

    box.addEventListener('input', ()=>{
      let val = box.value.toUpperCase();
      val = val.replace(/[^A-ZÁČĎÉĚÍŇÓŘŠŤÚŮÝŽ]/g, '').slice(-1);
      box.value = val;
      box.classList.remove('correct','incorrect');
      if(real){
        real.value = val;
        if(cd) cd.cellEl.classList.remove('correct','incorrect');
      }
      if(val){
        const next = clueFieldsEl.querySelector(`[data-pos="${pos+1}"]`);
        if(next) next.focus();
      }
    });

    box.addEventListener('keydown', (e)=>{
      if(e.key === 'Backspace' && !box.value){
        const prev = clueFieldsEl.querySelector(`[data-pos="${pos-1}"]`);
        if(prev){
          prev.value = '';
          prev.classList.remove('correct','incorrect');
          const prevReal = inputs[prev.dataset.key];
          if(prevReal) prevReal.value = '';
          prev.focus();
        }
        e.preventDefault();
      } else if(e.key === 'ArrowRight'){
        const next = clueFieldsEl.querySelector(`[data-pos="${pos+1}"]`);
        if(next){ next.focus(); e.preventDefault(); }
      } else if(e.key === 'ArrowLeft'){
        const prev = clueFieldsEl.querySelector(`[data-pos="${pos-1}"]`);
        if(prev){ prev.focus(); e.preventDefault(); }
      }
    });

    clueFieldsEl.appendChild(box);
  });
}

// pokud se píše přímo do mřížky, projeví se to i v pásu pod otázkou
function syncMirrorBox(key, val){
  const box = clueFieldsEl.querySelector(`[data-key="${key}"]`);
  if(box && document.activeElement !== box){
    box.value = val;
    box.classList.remove('correct','incorrect');
  }
}

function selectWord(idx, cellKey){
  currentWordIdx = idx;
  currentCellKey = cellKey;
  highlightWord(idx);
  const cd = cellData[cellKey];
  if(cd){
    cd.cellEl.classList.add('active');
    if(isMobilePortrait()){
      // na mobilu posouváme jen horní pás s mřížkou, aby aktivní slovo
      // nezůstalo skryté pod spodním panelem ani pod klávesnicí
      centerWordInBoardArea();
    } else {
      cd.cellEl.scrollIntoView({block:'center', inline:'center', behavior:'smooth'});
    }
  }
  const inp = inputs[cellKey];
  if(inp) inp.focus({preventScroll:true});
}

function goToWord(idx){
  const w = words[idx];
  selectWord(idx, w.cells[0]);
}

function wordsAt(key){
  return (cellWords[key]||[]).map(i=>words[i]);
}

function pickWordForCell(key, preferDir){
  const idxs = cellWords[key] || [];
  if(idxs.length===0) return null;
  if(preferDir){
    const found = idxs.find(i=>words[i].dir===preferDir);
    if(found!==undefined) return found;
  }
  return idxs[0];
}

// click handling
Object.keys(inputs).forEach(key=>{
  const input = inputs[key];
  input.addEventListener('focus', ()=>{
    currentCellKey = key;
    let preferDir = currentWordIdx!==null ? words[currentWordIdx].dir : null;
    const idx = pickWordForCell(key, preferDir);
    if(idx!==null){
      currentWordIdx = idx;
      highlightWord(idx);
      cellData[key].cellEl.classList.add('active');
    }
  });

  input.addEventListener('click', ()=>{
    // toggle direction if clicking again on a cell belonging to two words
    const idxs = cellWords[key]||[];
    if(idxs.length>1 && currentWordIdx!==null && idxs.includes(currentWordIdx)){
      const otherIdx = idxs.find(i=>i!==currentWordIdx);
      if(otherIdx!==undefined){
        currentWordIdx = otherIdx;
        highlightWord(otherIdx);
        cellData[key].cellEl.classList.add('active');
      }
    }
  });

  input.addEventListener('input', (e)=>{
    let val = e.target.value.toUpperCase();
    val = val.replace(/[^A-ZÁČĎÉĚÍŇÓŘŠŤÚŮÝŽ]/g, '');
    e.target.value = val.slice(-1);
    cellData[key].cellEl.classList.remove('correct','incorrect');
    syncMirrorBox(key, e.target.value);
    if(val){
      moveToNextCell(key);
    }
  });

  input.addEventListener('keydown', (e)=>{
    const r = parseInt(input.dataset.r), c = parseInt(input.dataset.c);
    if(e.key === 'Backspace' && !input.value){
      moveToPrevCell(key);
      e.preventDefault();
    } else if(e.key === 'ArrowRight'){
      focusCell(r, c+1); e.preventDefault();
    } else if(e.key === 'ArrowLeft'){
      focusCell(r, c-1); e.preventDefault();
    } else if(e.key === 'ArrowDown'){
      focusCell(r+1, c); e.preventDefault();
    } else if(e.key === 'ArrowUp'){
      focusCell(r-1, c); e.preventDefault();
    }
  });
});

function focusCell(r,c){
  const key = `${r},${c}`;
  if(inputs[key]) inputs[key].focus();
}

function moveToNextCell(key){
  if(currentWordIdx===null) return;
  const w = words[currentWordIdx];
  const pos = w.cells.indexOf(key);
  if(pos>=0 && pos < w.cells.length-1){
    const nextKey = w.cells[pos+1];
    inputs[nextKey].focus();
  }
}
function moveToPrevCell(key){
  if(currentWordIdx===null) return;
  const w = words[currentWordIdx];
  const pos = w.cells.indexOf(key);
  if(pos>0){
    const prevKey = w.cells[pos-1];
    inputs[prevKey].focus();
    inputs[prevKey].value = '';
    syncMirrorBox(prevKey, '');
  }
}

// check / reveal / clear
document.getElementById('checkBtn').addEventListener('click', ()=>{
  let allFilled = true;
  let allCorrect = true;
  Object.keys(cellData).forEach(key=>{
    const cd = cellData[key];
    const inp = inputs[key];
    cd.cellEl.classList.remove('correct','incorrect');
    if(!inp.value){
      allFilled = false;
    } else if(inp.value === cd.letter){
      cd.cellEl.classList.add('correct');
    } else {
      cd.cellEl.classList.add('incorrect');
      allCorrect = false;
    }
  });
  const status = document.getElementById('status');
  if(!allFilled){
    status.textContent = 'Křížovka ještě není celá vyplněná.';
    status.className = '';
  } else if(allCorrect){
    status.textContent = '🎉 Výborně! Křížovka je vyřešená správně.';
    status.className = 'win';
  } else {
    status.textContent = 'Některá políčka nejsou správně — zkus to znovu.';
    status.className = '';
  }
  if(currentWordIdx!==null) renderClueFields(currentWordIdx);
});

document.getElementById('clearBtn').addEventListener('click', ()=>{
  Object.keys(inputs).forEach(key=>{
    inputs[key].value = '';
    cellData[key].cellEl.classList.remove('correct','incorrect');
  });
  document.getElementById('status').textContent = '';
  document.getElementById('status').className = '';
  if(currentWordIdx!==null) renderClueFields(currentWordIdx);
});

// select first word by default
if(words.length){

let currentTextPage = 0;
const textModal = document.getElementById('textModal');
const textPageTitle = document.getElementById('textPageTitle');
const textPageBody = document.getElementById('textPageBody');
const textPageIndicator = document.getElementById('textPageIndicator');
const textPrevBtn = document.getElementById('textPrevBtn');
const textNextBtn = document.getElementById('textNextBtn');

function renderTextPage(){
  const p = TEXT_PAGES[currentTextPage];
  textPageTitle.textContent = p.title;
  textPageBody.innerHTML = p.html;
  textPageIndicator.textContent = `${currentTextPage+1} / ${TEXT_PAGES.length}`;
  textPrevBtn.disabled = currentTextPage === 0;
  textNextBtn.disabled = currentTextPage === TEXT_PAGES.length - 1;
  textPageBody.scrollTop = 0;
}

function openTextModal(){
  textModal.classList.remove('hidden');
  renderTextPage();
}
function closeTextModal(){
  textModal.classList.add('hidden');
  if(location.hash === '#text'){
    history.replaceState(null, '', location.pathname + location.search);
  }
}

document.getElementById('qrCorner').addEventListener('click', openTextModal);
document.getElementById('closeTextModal').addEventListener('click', closeTextModal);
textModal.addEventListener('click', (e)=>{ if(e.target === textModal) closeTextModal(); });
textPrevBtn.addEventListener('click', ()=>{
  if(currentTextPage > 0){ currentTextPage--; renderTextPage(); }
});
textNextBtn.addEventListener('click', ()=>{
  if(currentTextPage < TEXT_PAGES.length - 1){ currentTextPage++; renderTextPage(); }
});
document.addEventListener('keydown', (e)=>{
  if(textModal.classList.contains('hidden')) return;
  if(e.key === 'Escape') closeTextModal();
});
